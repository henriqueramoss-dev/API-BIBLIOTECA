# Nome da aplicação exibido pelo Spring Boot
spring.application.name=biblioteca

# Porta usada pela API
server.port=8080

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:biblioteca;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria as tabelas ao iniciar e remove ao encerrar a aplicação
spring.jpa.hibernate.ddl-auto=create-drop

# Evita manter a sessão JPA aberta durante toda a resposta HTTP
spring.jpa.open-in-view=false

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Endereços da documentação OpenAPI/Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Organização visual da interface Swagger
springdoc.swagger-ui.display-request-duration=true

# Paginação: 10 registros por padrão e no máximo 100 por página
# (valores fora do limite são recusados com HTTP 400, ver config/PaginacaoConfig.java)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# CORS: sites (origens) que podem chamar a API pelo navegador, separados por vírgula.
# Aceita padrões com * (ver config/CorsConfig.java). Em produção, use os endereços reais do site.
biblioteca.cors.origens-permitidas=http://localhost:*,http://127.0.0.1:*,http://192.168.*:*

# Chave de API de administrador criada ao iniciar (ver seguranca/ChaveAdminInicial.java).
# Defina a variável de ambiente BIBLIOTECA_CHAVE_ADMIN (mínimo de 16 caracteres) para fixar a chave.
# Sem ela, a API gera uma chave aleatória a cada início e mostra no log.
biblioteca.chave-api.admin-inicial=${BIBLIOTECA_CHAVE_ADMIN:}

# Limite de requisições por cliente, em janelas de 1 minuto (ver seguranca/LimiteDeRequisicoesFilter.java).
# Com chave de API válida, o cliente é a chave; sem chave, é o endereço IP. Acima do limite: HTTP 429.
biblioteca.limite.ativo=true
biblioteca.limite.requisicoes-por-minuto.sem-chave=60
biblioteca.limite.requisicoes-por-minuto.com-chave=300

# Por quantas horas a resposta de um POST com X-Idempotency-Key fica guardada
# (ver seguranca/IdempotenciaFilter.java).
biblioteca.idempotencia.validade-horas=24

# Versionamento da API pelo cabeçalho X-API-Version (recurso nativo do Spring Framework 7).
# Sem o cabeçalho, vale a versão 1. Versões não suportadas respondem HTTP 400.
# Rotas sem versão declarada atendem todas as versões; GET /livros e GET /livros/{id} têm as versões 1 e 2.
spring.mvc.apiversion.use.header=X-API-Version
spring.mvc.apiversion.default=1
spring.mvc.apiversion.supported=1,2

# Reservas feitas pelo cliente no site: dias para retirar o livro na biblioteca e
# quantas reservas aguardando retirada cada pessoa pode ter ao mesmo tempo
biblioteca.reservas.dias-para-retirar=3
biblioteca.reservas.maximo-por-usuario=3

# Conta do dono da biblioteca (tipo FUNCIONARIO), criada ao iniciar a API quando e-mail e senha forem informados.
# Útil porque o banco é em memória e some a cada reinício. Em produção, defina pelas variáveis de ambiente
# BIBLIOTECA_DONO_EMAIL e BIBLIOTECA_DONO_SENHA (a senha deve ter de 8 a 72 caracteres).
biblioteca.dono.email=
biblioteca.dono.senha=
biblioteca.dono.nome=Dono da Biblioteca

# Acervo de exemplo carregado ao iniciar (categorias, autores, livros, clientes, carteirinhas e empréstimos),
# para o Swagger e o site não começarem vazios. Desligue com BIBLIOTECA_DADOS_EXEMPLO=false.
biblioteca.dados-exemplo=true

# Swagger UI pensado para apresentação: Try it out já ligado, caixa de busca, grupos recolhidos,
# chave de API lembrada ao recarregar a página ou trocar de versão, e modelos recolhidos.
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.default-models-expand-depth=0
