name: Teste Biblioteca API

on:
  push:
    branches:
      - develop
    paths:
      - "biblioteca-api/**"
      - ".github/workflows/test-biblioteca.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: biblioteca-api

    # Chave de administrador da API usada só neste teste (a API em memória é descartada no fim).
    env:
      BIBLIOTECA_CHAVE_ADMIN: chave-admin-somente-para-o-ci

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e testar
        run: mvn -B clean test

      - name: Gerar aplicacao
        run: mvn -B package -DskipTests

      - name: Iniciar API
        run: |
          java -jar target/*.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Verificar inicializacao e Swagger
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/v3/api-docs > openapi.json; then
              echo "API iniciada e OpenAPI disponivel."
              break
            fi
            sleep 2
          done

          curl -fsS "http://localhost:8080/livros?page=0&size=10" > livros.json
          echo "Catalogo publico (GET /livros) respondeu sem chave de API."

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "http://localhost:8080/usuarios?page=0&size=10")
          test "$STATUS" = "401"
          echo "Rota protegida (GET /usuarios) sem chave respondeu 401."

          curl -fsS -H "X-API-Key: $BIBLIOTECA_CHAVE_ADMIN" "http://localhost:8080/usuarios?page=0&size=10" > usuarios.json
          echo "Rota protegida (GET /usuarios) com chave respondeu com sucesso."

      - name: Smoke test de livros e emprestimos
        run: |
          set -e
          req() {
            NAME="$1"; EXPECTED="$2"; shift 2
            STATUS=$(curl -sS -o resposta.json -w "%{http_code}" -H "X-API-Key: $BIBLIOTECA_CHAVE_ADMIN" "$@")
            echo "$NAME -> HTTP $STATUS"
            cat resposta.json || true
            echo
            if [ "$STATUS" != "$EXPECTED" ]; then
              echo "Falha em: $NAME. Esperado $EXPECTED, recebido $STATUS"
              echo "===== app.log ====="
              cat app.log || true
              exit 1
            fi
          }
          JSON="Content-Type: application/json"
          # O id do registro criado vem no link self (HATEOAS).
          id() { jq -r '._links.self.href' resposta.json | grep -o '[0-9]*$'; }

          req "POST usuario" "201" -X POST http://localhost:8080/usuarios -H "$JSON" \
            -d '{"nome":"Usuario Emprestimo","email":"emprestimo@teste.local","cpf":"12345678909","tipo":"ALUNO","telefone":"11999990000","endereco":"Rua A, 10","cidade":"Sao Paulo","estado":"SP","cep":"01001000","dataNascimento":"2000-01-01"}'
          USUARIO_ID=$(id)

          req "POST categoria" "201" -X POST http://localhost:8080/categorias -H "$JSON" \
            -d '{"nome":"Romance","codigo":"ROM"}'
          CATEGORIA_ID=$(id)

          req "POST autor" "201" -X POST http://localhost:8080/autores -H "$JSON" \
            -d '{"nome":"Machado de Assis","nacionalidade":"Brasileira"}'
          AUTOR_ID=$(id)

          req "POST livro" "201" -X POST http://localhost:8080/livros -H "$JSON" \
            -d "{\"titulo\":\"Dom Casmurro\",\"isbn\":\"9788535910663\",\"anoPublicacao\":1899,\"editora\":\"Garnier\",\"numeroPaginas\":256,\"categoriaId\":$CATEGORIA_ID,\"autoresIds\":[$AUTOR_ID]}"
          LIVRO_ID=$(id)

          req "GET livros" "200" "http://localhost:8080/livros?page=0&size=10"
          grep -q "Dom Casmurro" resposta.json

          req "POST emprestimo" "201" -X POST http://localhost:8080/emprestimos -H "$JSON" \
            -d "{\"dataEmprestimo\":\"2026-10-06\",\"dataPrevistaDevolucao\":\"2026-10-25\",\"status\":\"ATIVO\",\"usuarioId\":$USUARIO_ID,\"livroId\":$LIVRO_ID}"
          EMPRESTIMO_ID=$(id)

          req "GET emprestimos" "200" "http://localhost:8080/emprestimos?page=0&size=10"
          req "GET emprestimo por ID" "200" "http://localhost:8080/emprestimos/$EMPRESTIMO_ID"
          req "GET emprestimos por status" "200" "http://localhost:8080/emprestimos/buscar?status=ATIVO&page=0&size=10"

          req "PUT emprestimo" "200" -X PUT "http://localhost:8080/emprestimos/$EMPRESTIMO_ID" -H "$JSON" \
            -d "{\"dataEmprestimo\":\"2026-10-06\",\"dataPrevistaDevolucao\":\"2026-10-25\",\"dataDevolucao\":\"2026-10-20\",\"status\":\"DEVOLVIDO\",\"usuarioId\":$USUARIO_ID,\"livroId\":$LIVRO_ID}"
          grep -q "DEVOLVIDO" resposta.json
          echo "Fluxo de livros e emprestimos concluido com sucesso."

      - name: Encerrar API
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi
